# openspec/config.yaml
schema: spec-driven

context: |
  Sistema de Gestión de Tickets (Soporte/IT, Compras, Reparaciones Edilicias).
  Tech stack: PostgreSQL + NestJS (TypeScript) backend, Next.js (App Router) + Tailwind + Shadcn/Tremor frontend.
  ORM: Prisma escondido tras puertos de repositorio (PrismaService confinado a infrastructure/).
  Architecture: Hexagonal / Clean por módulo (Screaming Architecture: tickets, compras, reparaciones, equipos, auth, clientes, usuarios).
  Dependency rule: domain → application → infrastructure → presentation. El dominio NO conoce Prisma ni Nest.
  IDs: UUIDv7 (anti-IDOR en API pública/mobile, ordenable temporalmente).
  Permisos: RBAC híbrido (roles + permisos granulares recurso:accion) con guards Nest encadenados.
  Multitenancy: separación FÍSICA por schemas (master/tenant, estilo educandow). Aislamiento físico, no por filtro.
  Auditoría: created_at, updated_at, deleted_at (soft delete) en TODAS las entidades.
  Adjuntos: puerto IFileStorage, metadata en DB, binario fuera (NUNCA blobs).
  API: agnóstica al cliente, respuesta unificada { success: true, data: [...] }.
  Testing: Vitest (NestJS + Next.js), Strict TDD habilitado.
  Style: TypeScript strict, Conventional Commits, snake_case ASCII en DB.

rules:
  proposal:
    - Especificar qué flujo(s) afecta (SOPORTE | COMPRAS | EDILICIA | CORE | ALL)
    - Incluir rollback plan para cambios riesgosos (migraciones, cambios de esquema)
    - Mapear las capacidades/módulos afectados
  specs:
    - Usar Given/When/Then para escenarios
    - Usar RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Cada escenario debe ser verificable
    - Toda entidad nueva DEBE incluir auditoría + soft delete
  design:
    - Incluir decisiones de arquitectura con rationale (Contexto → Opciones → Recomendación → Justificación)
    - Especificar qué archivos se crean/modifican/eliminan
    - Respetar la regla de dependencias hexagonal (domain sin Prisma/Nest)
    - Puertos en domain/ports; implementaciones + mappers en infrastructure
  tasks:
    - Agrupar por fase, usar numeración jerárquica
    - Cada tarea debe ser completable en una sesión
    - Separar por capa (domain/application/infrastructure/presentation)
  apply:
    - Seguir patrones existentes del codebase
    - PrismaService prohibido fuera de infrastructure/ (fitness rule)
    tdd: true
    test_command: "cd backend && pnpm test"   # pnpm test = vitest run (backend ya scaffoldeado)
  verify:
    test_command: "cd backend && pnpm test"
    build_command: "cd backend && pnpm build"
    coverage_threshold: 80
  archive:
    - Mergear deltas sin perder especificaciones canónicas
