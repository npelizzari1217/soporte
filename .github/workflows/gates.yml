# Compuertas de calidad del repo "soporte".
#
# No hay workspace en la raiz: backend/ y frontend/ son dos proyectos pnpm
# independientes, cada uno con su propio pnpm-lock.yaml. Por eso este workflow
# tiene un job por proyecto en vez de una matriz: backend declara "typecheck"
# y frontend no, asi que una matriz obligaria a condicionales por paso segun
# el proyecto (`if: matrix.project == 'backend'`), lo que termina siendo mas
# dificil de leer que dos jobs explicitos con los pasos que a cada uno le
# corresponden.
name: gates

on:
  push:
    branches: [main]
  pull_request:

# Cancela una corrida anterior del mismo ref (misma rama o mismo PR) cuando
# llega un push nuevo, para no gastar minutos de CI en corridas obsoletas.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# pnpm/action-setup resuelve su version leyendo el "packageManager" de un
# package.json, y su default es el de la raiz. Este repo no tiene raiz: por eso
# cada job le pasa "package_json_file" apuntando al package.json de su proyecto.
# Sin eso la accion muere con "No pnpm version is specified" antes de instalar
# nada. El "defaults.run.working-directory" no alcanza: solo aplica a los pasos
# "run", no a las acciones invocadas con "uses".

jobs:
  # Corre primero: verifica que backend y frontend sigan declarando lint/test/build
  # antes de gastar tiempo corriendo las compuertas reales. Si un proyecto nuevo se
  # agrega sin cubrirlo, este job frena el resto.
  gate-coverage:
    runs-on: ubuntu-latest
    # Que areas toco el cambio. Los dos jobs de abajo lo leen para saltearse
    # cuando no los toca: medido sobre los ultimos 15 PRs, 9 tocaron solo
    # `backend/`, 4 solo `frontend/` y uno solo toco ambos, asi que 14 de 15
    # corrian una compuerta entera al pedo.
    outputs:
      backend: ${{ steps.cambios.outputs.backend }}
      frontend: ${{ steps.cambios.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      # Resuelve la deteccion para `push` y para `pull_request`, que se calculan
      # distinto (uno compara contra el commit anterior, el otro contra la base
      # del PR). Hacerlo a mano con `git diff` tiene casos borde -- clone shallow,
      # primer push de una rama -- que no podemos probar: la cuota de Actions
      # esta agotada y estos workflows no corren.
      - uses: dorny/paths-filter@v3
        id: cambios
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/gates.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/gates.yml'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Este paso NO se filtra y corre siempre, a proposito: verifica que TODO
      # proyecto npm del repo declare sus compuertas. Si se filtrara, un PR que
      # agregue un proyecto nuevo lo saltearia en silencio -- justo lo que el
      # guard existe para evitar.
      - run: node scripts/check-gate-coverage.mjs

  backend:
    needs: gate-coverage
    if: needs.gate-coverage.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # La suite de integracion habla con un Postgres real: no hay mocks del ORM.
    # El servicio se declara aca en vez de en un docker-compose porque el repo no
    # tiene uno a proposito (backend/ y frontend/ son proyectos independientes) y
    # porque un compose en el repo describiria el entorno local, no el del runner.
    #
    # El rol tiene que poder crear y borrar bases: los specs de provisionamiento
    # emiten CREATE DATABASE / DROP DATABASE sobre bases efimeras soporte_prov_*_test
    # (src/clientes/infrastructure/postgres-admin.service.ts) y el globalSetup de
    # test/barrido-huerfanas.global-setup.mjs barre las huerfanas al arrancar. El rol
    # que crea POSTGRES_USER es superusuario de la instancia, asi que cumple.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soporte
          POSTGRES_PASSWORD: soporte
          POSTGRES_DB: soporte_master_test
        ports:
          - 5432:5432
        # Sin health-check el job arranca antes de que Postgres acepte conexiones
        # y las migraciones fallan con ECONNREFUSED.
        options: >-
          --health-cmd "pg_isready -U soporte -d soporte_master_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Los cuatro valores son de test y van literales, no en secrets: no protegen
    # nada. DATABASE_URL_MASTER, APP_BASE_URL y JWT_SECRET son el contrato de
    # src/config/validar-entorno.ts. DATABASE_URL_TENANT no lo es, pero sin el los
    # specs de aislamiento entre inquilinos SE SALTEAN en vez de fallar, y una
    # compuerta que saltea lo mas critico del producto no es una compuerta.
    #
    # El host tiene que ser localhost: test/guardarrail-host.global-setup.mjs aborta
    # la corrida entera si alguna DATABASE_URL_* apunta a otra cosa.
    env:
      DATABASE_URL_MASTER: postgresql://soporte:soporte@localhost:5432/soporte_master_test
      DATABASE_URL_TENANT: postgresql://soporte:soporte@localhost:5432/soporte_tenant_test
      APP_BASE_URL: http://localhost:5173
      JWT_SECRET: jwt-secret-de-test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # POSTGRES_DB solo crea la master. La de tenant hay que crearla aparte, y
      # antes de migrarla.
      - name: Crear la base de tenant de test
        run: psql "$DATABASE_URL_MASTER" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE soporte_tenant_test'

      # backend/package.json no tiene hook "pretest": su unico postinstall son los
      # dos `prisma generate`. Las migraciones son pasos explicitos o no corren.
      - run: pnpm run migrate:master
      - run: pnpm run migrate:tenant

      - run: pnpm run lint
      - run: pnpm run typecheck

      # El servicio "postgres" de arriba es un contenedor Docker con nombre
      # generado por Actions, no "soporte-postgres-master" (el fijo de
      # desarrollo local). regenerar-entorno.integration.spec.ts inspecciona
      # ese contenedor por nombre (resolverNombreContenedor(), issue #122):
      # sin este paso lo ve "ausente" y varios tests fallan aunque Postgres
      # este corriendo. Lo descubrimos por imagen (postgres:16, la misma
      # declarada arriba) y lo exportamos via GITHUB_ENV para que quede
      # disponible en el resto de los steps del job, incluido "pnpm run test".
      # Si no aparece ningun contenedor con esa imagen, el paso falla ruidoso
      # en vez de dejar que la suite falle mas abajo con un mensaje confuso.
      - name: Descubrir el nombre del service container de Postgres
        run: |
          NOMBRE=$(docker ps --filter "ancestor=postgres:16" --format '{{.Names}}' | head -n 1)
          if [ -z "$NOMBRE" ]; then
            echo "No se encontro ningun contenedor corriendo con imagen postgres:16" >&2
            exit 1
          fi
          echo "SOPORTE_PG_CONTAINER=$NOMBRE" >> "$GITHUB_ENV"

      - run: pnpm run test
      - run: pnpm run build

  frontend:
    needs: gate-coverage
    if: needs.gate-coverage.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Solo `next build` necesita esto: carga next.config.ts, que exige JWT_SECRET
    # sin default y aborta el build. `pnpm run test` corre en jsdom y no importa
    # next.config.ts. BACKEND_URL no va: ya tiene default en next.config.ts.
    env:
      JWT_SECRET: jwt-secret-de-test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
