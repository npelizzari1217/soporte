# Compuertas del repo "soporte" que corren SIEMPRE, toque lo que toque el cambio.
#
# Las de codigo viven aparte, en gates-backend.yml y gates-frontend.yml, cada una
# con su filtro `paths` nativo (issue #188): 14 de cada 15 PRs tocan un solo
# proyecto, y hacer correr la compuerta del otro gastaba minutos de Actions en
# algo que no podia romperse. El filtro `paths` a nivel workflow se evalua ANTES
# de que exista un runner, asi que un workflow filtrado cuesta CERO — a
# diferencia de un filtro por job, que necesita un runner para decidir y factura
# el minuto igual. El razonamiento completo esta en la cabecera de
# gates-backend.yml.
#
# Los dos jobs de aca NO llevan filtro, y es deliberado:
#
#   - gate-coverage es el guard que verifica que todo proyecto npm del repo
#     declare lint/test/build. Filtrarlo seria el peor error posible: un PR que
#     agrega un proyecto nuevo sin compuertas lo saltearia en silencio, que es
#     exactamente lo que el guard existe para impedir.
#   - roadmap mide la distancia entre el ancla del documento y `main`. Esa
#     distancia crece con CUALQUIER commit, no solo con los que tocan docs/. Un
#     filtro por rutas lo volveria ciego justo al caso que persigue: el documento
#     envejece porque el repo avanza por otro lado.
#
# Los dos son baratos — checkout, node y un script— asi que correrlos siempre no
# es lo que consume la cuota.
name: gates

on:
  push:
    branches: [main]
  pull_request:

# Cancela una corrida anterior del mismo ref (misma rama o mismo PR) cuando
# llega un push nuevo, para no gastar minutos de CI en corridas obsoletas.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-gate-coverage.mjs

  # Necesita `fetch-depth: 0` porque contrasta shas contra `main` con merge-base
  # y rev-list, y sobre el clon superficial que checkout trae por defecto las dos
  # cosas fallan — hacia el verde, que es el modo de falla peligroso.
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-roadmap-fresco.mjs
