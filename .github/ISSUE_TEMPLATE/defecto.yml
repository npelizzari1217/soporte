name: Defecto
description: Algo que hoy anda mal en soporte
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Un issue no se aprueba solo: para habilitar el PR que lo cierre, alguien
        con permiso tiene que agregarle el label `status:approved`.

  - type: textarea
    id: que-pasa
    attributes:
      label: Que pasa
      description: La conducta observada, no la causa que sospechas.
      placeholder: Al guardar un insumo sin stock minimo, la pantalla vuelve en blanco.
    validations:
      required: true

  - type: textarea
    id: que-deberia-pasar
    attributes:
      label: Que deberia pasar
    validations:
      required: true

  - type: textarea
    id: como-reproducirlo
    attributes:
      label: Como reproducirlo
      description: Los pasos minimos. Si depende de datos de un inquilino, decilo sin pegar datos reales.
      placeholder: |
        1. Entrar a /admin/insumos
        2. ...
    validations:
      required: true

  - type: dropdown
    id: capa
    attributes:
      label: Donde se manifiesta
      options:
        - Frontend
        - Backend
        - Base de datos
        - No se
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Mensaje de error, log o captura. Sin secrets ni connection strings.
    validations:
      required: false
